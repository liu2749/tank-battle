<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坦克大战 · Battle City</title>
<style>
  :root {
    --bg: #0d0f14;
    --panel: #171a21;
    --border: #2a2f3a;
    --accent: #f2c14e;
    --text: #d8dee9;
    --muted: #8a93a6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    user-select: none;
  }
  h1 {
    font-size: 22px;
    letter-spacing: 6px;
    margin-bottom: 16px;
    color: var(--accent);
    text-shadow: 0 0 12px rgba(242,193,78,.35);
  }
  #hud {
    display: flex;
    gap: 22px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 12px;
    font-size: 14px;
    color: var(--muted);
  }
  #hud b { color: var(--text); font-weight: 600; }
  #wrap {
    position: relative;
    border: 3px solid var(--border);
    border-radius: 6px;
    background: #000;
    line-height: 0;
    box-shadow: 0 10px 40px rgba(0,0,0,.6);
  }
  canvas {
    display: block;
    width: 624px;
    height: 624px;
    image-rendering: pixelated;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(10,12,16,.82);
    text-align: center;
    padding: 24px;
  }
  #overlay h2 { font-size: 34px; color: var(--accent); letter-spacing: 4px; }
  #overlay p { color: var(--muted); font-size: 14px; line-height: 1.8; }
  #overlay .key { display:inline-block; padding:2px 8px; background:var(--panel); border:1px solid var(--border); border-radius:4px; color:var(--text); font-size:12px; margin:0 2px; }
  #overlay button {
    margin-top: 6px;
    padding: 10px 30px;
    font-size: 15px;
    letter-spacing: 2px;
    color: #12151c;
    background: var(--accent);
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-weight: 700;
  }
  #overlay button:hover { filter: brightness(1.08); }
  #hint {
    margin-top: 14px;
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    line-height: 1.8;
  }
  #hint .key { display:inline-block; padding:1px 7px; background:var(--panel); border:1px solid var(--border); border-radius:4px; font-size:12px; margin:0 2px; }
</style>
</head>
<body>
  <h1>坦克大战</h1>
  <div id="hud">
    <div>得分 <b id="score">0</b></div>
    <div>生命 <b id="lives">3</b></div>
    <div>关卡 <b id="level">1</b></div>
    <div>敌人 <b id="enemies">10</b></div>
  </div>
  <div id="wrap">
    <canvas id="game"></canvas>
    <div id="overlay">
      <h2 id="otitle">坦克大战</h2>
      <p id="otext">
        保卫基地，消灭所有敌方坦克！<br>
        <span class="key">W A S D</span> / <span class="key">方向键</span> 移动
        &nbsp; <span class="key">空格</span> / <span class="key">J</span> 射击
      </p>
      <button id="startBtn">开始游戏</button>
    </div>
  </div>
  <div id="hint">
    暂停：<span class="key">P</span> &nbsp; 重新开始：<span class="key">R</span><br>
    砖墙可被摧毁 · 钢墙坚不可摧 · 坦克可穿过草丛 · 水会阻挡坦克
  </div>

<script>
'use strict';
/* ============ 基础常量 ============ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const SCALE = 3;            // 渲染放大倍数（保持像素清晰）
const TILE = 16;            // 逻辑瓦片尺寸
const GRID = 13;            // 13 x 13 网格
const FIELD = TILE * GRID;  // 208 逻辑像素
canvas.width = FIELD * SCALE;
canvas.height = FIELD * SCALE;
ctx.imageSmoothingEnabled = false;

/* ============ 地图图例 ============ */
const EMPTY = 0, BRICK = 1, STEEL = 2, WATER = 3, TREE = 4, BASE = 5;
const LEGEND = { '.': EMPTY, '#': BRICK, '@': STEEL, '~': WATER, '%': TREE, 'B': BASE };

/* ============ 方向 ============ */
const DIR = { UP: 0, RIGHT: 1, DOWN: 2, LEFT: 3 };
const DX = [0, 1, 0, -1];
const DY = [-1, 0, 1, 0];

const PLAYER_SPEED = 55;
const ENEMY_SPEED = 40;
const BULLET_SPEED = 150;

/* ============ 关卡地图 ============ */
const LEVELS = [
  [
    '.............',
    '.#.#.#.#.#.#.',
    '.#.#.#.#.#.#.',
    '.............',
    '.#.#.@@@.#.#.',
    '.#.#.@@@.#.#.',
    '.............',
    '.#.#.#.#.#.#.',
    '.#.#.#.#.#.#.',
    '.............',
    '.#.#.#.#.#.#.',
    '......#......',
    '.....#B#.....',
  ],
  [
    '.............',
    '.#.#.~.~.#.#.',
    '.#.#.~.~.#.#.',
    '.....~.~.....',
    '.#.#.@@@.#.#.',
    '.#...@@@...#.',
    '.#...@@@...#.',
    '.#.#.@@@.#.#.',
    '.....~.~.....',
    '.#.#.~.~.#.#.',
    '.#.#.~.~.#.#.',
    '......#......',
    '.....#B#.....',
  ],
  [
    '.............',
    '.#.@.@.@.@.#.',
    '.#.@.@.@.@.#.',
    '.............',
    '..#...#...#..',
    '..#...#...#..',
    '.............',
    '..@.@.#.@.@..',
    '..@.@.#.@.@..',
    '.............',
    '..#...#...#..',
    '......#......',
    '.....#B#.....',
  ],
];

function parseMap(rows) {
  return rows.map(r => (r + '.............').slice(0, GRID).split('').map(c => LEGEND[c] ?? EMPTY));
}

/* ============ 全局状态 ============ */
let state = 'menu';          // menu | playing | paused | gameover | win
let level = 0;
let score = 0;
let lives = 3;
let map = [];
let player = null;
let enemies = [];
let bullets = [];
let effects = [];
let enemiesRemaining = 0;    // 本关还需消灭的数量
let enemiesSpawned = 0;      // 已生成的敌人数
let spawnQueue = 0;          // 待生成的敌人总数
let spawnTimer = 0;          // 生成间隔计时
let baseAlive = true;
let shake = 0;

const ENEMY_SPAWN = [{ x: 0, y: 0 }, { x: 96, y: 0 }, { x: 192, y: 0 }];
const PLAYER_SPAWN = { x: 32, y: 192 };
const BASE_POS = { x: 6 * TILE, y: 12 * TILE };

const keys = {};
let audioCtx = null;

/* ============ 音效（Web Audio，简单合成） ============ */
function ensureAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freq, dur, type, vol, slide) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(vol || 0.08, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(audioCtx.destination);
  o.start(t); o.stop(t + dur);
}
const sfx = {
  shoot: () => tone(880, 0.08, 'square', 0.05, 440),
  brick: () => tone(180, 0.12, 'sawtooth', 0.07, 60),
  steel: () => tone(1200, 0.05, 'square', 0.05),
  boom:  () => { tone(120, 0.3, 'sawtooth', 0.12, 40); tone(90, 0.4, 'square', 0.08, 30); },
  base:  () => { tone(200, 0.6, 'sawtooth', 0.15, 40); tone(100, 0.7, 'square', 0.1, 30); },
  spawn: () => tone(500, 0.15, 'triangle', 0.06, 700),
  start: () => { tone(440, 0.1, 'square', 0.06); setTimeout(() => tone(660, 0.12, 'square', 0.06), 110); },
  win:   () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.18, 'triangle', 0.08), i * 120)); },
};

/* ============ 工具 ============ */
function canMove(tank, nx, ny, ignoreSelf) {
  if (nx < 0 || ny < 0 || nx + TILE > FIELD || ny + TILE > FIELD) return false;
  const tx0 = Math.floor(nx / TILE), ty0 = Math.floor(ny / TILE);
  const tx1 = Math.floor((nx + TILE - 1) / TILE), ty1 = Math.floor((ny + TILE - 1) / TILE);
  for (let ty = ty0; ty <= ty1; ty++)
    for (let tx = tx0; tx <= tx1; tx++) {
      const t = map[ty][tx];
      if (t === BRICK || t === STEEL || t === WATER || t === BASE) return false;
    }
  // 与其它坦克的碰撞
  const all = (ignoreSelf ? [] : [player]).concat(enemies);
  for (const o of all) {
    if (o === tank || !o) continue;
    if (nx < o.x + TILE && nx + TILE > o.x && ny < o.y + TILE && ny + TILE > o.y) return false;
  }
  return true;
}

function setDir(tank, d) {
  if (tank.dir === d) return true;
  const vertical = (d === DIR.UP || d === DIR.DOWN);
  const axis = vertical ? tank.x : tank.y;
  const r = axis % 8;
  const cands = r === 0 ? [axis] : [axis - r, axis - r + 8];
  for (const a of cands) {
    const nx = vertical ? a : tank.x;
    const ny = vertical ? tank.y : a;
    if (nx < 0 || ny < 0 || nx + TILE > FIELD || ny + TILE > FIELD) continue;
    if (canMove(tank, nx, ny, true)) {
      tank.x = nx; tank.y = ny; tank.dir = d; return true;
    }
  }
  return false;
}

function hitTank(t, b) {
  return b.x < t.x + TILE && b.x + 4 > t.x && b.y < t.y + TILE && b.y + 4 > t.y;
}

/* ============ 实体操作 ============ */
function makeTank(x, y, dir, speed, isPlayer) {
  return { x, y, dir, speed, isPlayer, invuln: isPlayer ? 1.5 : 0.8, shootTimer: 0, thinkTimer: 1 };
}

function shoot(tank) {
  // 每辆坦克最多同时存在 1 发子弹（实时统计，避免计数失配）
  if (bullets.some(b => !b.dead && b.owner === tank)) return;
  const cx = tank.x + 8, cy = tank.y + 8;
  bullets.push({
    x: cx - 2 + DX[tank.dir] * 10,
    y: cy - 2 + DY[tank.dir] * 10,
    dir: tank.dir,
    owner: tank,
    dead: false,
  });
  sfx.shoot();
}

function spawnEnemy() {
  // 依次尝试三个出生点，找空闲位置
  for (let i = 0; i < ENEMY_SPAWN.length; i++) {
    const pt = ENEMY_SPAWN[(enemiesSpawned + i) % ENEMY_SPAWN.length];
    if (!tankAt(pt.x, pt.y)) {
      enemies.push(makeTank(pt.x, pt.y, DIR.DOWN, ENEMY_SPEED, false));
      enemiesSpawned++;
      sfx.spawn();
      return true;
    }
  }
  return false;
}

function tankAt(x, y) {
  const box = o => o && !(x >= o.x + TILE || x + TILE <= o.x || y >= o.y + TILE || y + TILE <= o.y);
  return box(player) ? player : enemies.find(box);
}

function destroyTank(t) {
  addEffect('boom', t.x + 8, t.y + 8, 0.5);
  if (t.isPlayer) {
    lives--;
    player = null;
    sfx.boom();
    if (lives <= 0) { gameOver(); return; }
    // 重生
    setTimeout(() => {
      if (state === 'playing' && !player) {
        if (tankAt(PLAYER_SPAWN.x, PLAYER_SPAWN.y)) { gameOver(); return; }
        player = makeTank(PLAYER_SPAWN.x, PLAYER_SPAWN.y, DIR.UP, PLAYER_SPEED, true);
      }
    }, 600);
  } else {
    const i = enemies.indexOf(t);
    if (i >= 0) enemies.splice(i, 1);
    score += 100;
    enemiesRemaining--;
    sfx.boom();
    updateHUD();
    if (enemiesRemaining <= 0 && spawnQueue <= 0) { levelClear(); }
  }
}

function destroyBase() {
  if (!baseAlive) return;
  baseAlive = false;
  addEffect('boom', BASE_POS.x + 8, BASE_POS.y + 8, 0.8);
  sfx.base();
  shake = 0.5;
  setTimeout(() => { if (state === 'playing') gameOver(); }, 900);
}

function levelClear() {
  state = 'win';
  sfx.win();
  showOverlay('关卡完成！', '得分：' + score + '<br>按 <span class="key">Enter</span> 进入下一关');
}

function gameOver() {
  if (state === 'gameover' || state === 'win') return;
  state = 'gameover';
  showOverlay('游戏结束', '最终得分：' + score + '<br>按 <span class="key">Enter</span> 重新开始');
}

/* ============ 粒子特效 ============ */
function addEffect(type, x, y, size) {
  const n = type === 'boom' ? 14 : 6;
  const parts = [];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = (type === 'boom' ? 20 : 30) * (0.4 + Math.random());
    parts.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: 0.4 + Math.random() * 0.3,
      maxLife: 0.7,
      color: type === 'boom' ? ['#f2c14e', '#e07b39', '#d8dee9'][i % 3] : '#f2c14e',
    });
  }
  effects.push({ parts, life: 0.7 });
}

/* ============ 输入 ============ */
window.addEventListener('keydown', e => {
  const k = e.key;
  ensureAudio();
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k)) e.preventDefault();
  keys[k] = true;
  if (k === ' ' || k === 'j' || k === 'J') {
    if (state === 'playing' && player) shoot(player);
  }
  if (k === 'p' || k === 'P') {
    if (state === 'playing') { state = 'paused'; showOverlay('已暂停', '按 <span class="key">P</span> 继续'); }
    else if (state === 'paused') { state = 'playing'; hideOverlay(); }
  }
  if (k === 'r' || k === 'R') startGame(level);
  if (k === 'Enter') {
    if (state === 'win') startGame(level + 1);
    else if (state === 'gameover') startGame(0);
    else if (state === 'menu') startGame(0);
  }
});
window.addEventListener('keyup', e => { keys[e.key] = false; });
document.getElementById('startBtn').addEventListener('click', () => { ensureAudio(); startGame(0); });

/* ============ 流程控制 ============ */
function startGame(lv) {
  ensureAudio();
  level = lv % LEVELS.length;
  score = (lv === 0 || state === 'gameover' || state === 'menu') ? 0 : score;
  if (lv === 0 || state === 'gameover' || state === 'menu') lives = 3;
  map = parseMap(LEVELS[level]);
  enemies = []; bullets = []; effects = [];
  enemiesSpawned = 0; spawnTimer = 0; baseAlive = true; shake = 0;
  enemiesRemaining = spawnQueue = 10;
  player = makeTank(PLAYER_SPAWN.x, PLAYER_SPAWN.y, DIR.UP, PLAYER_SPEED, true);
  state = 'playing';
  hideOverlay();
  updateHUD();
  sfx.start();
}

function updateHUD() {
  document.getElementById('score').textContent = score;
  document.getElementById('lives').textContent = lives;
  document.getElementById('level').textContent = level + 1;
  document.getElementById('enemies').textContent = enemiesRemaining;
}

function showOverlay(title, html) {
  document.getElementById('otitle').textContent = title;
  document.getElementById('otext').innerHTML = html;
  document.getElementById('overlay').style.display = 'flex';
  document.getElementById('startBtn').style.display = 'none';
}
function hideOverlay() {
  document.getElementById('overlay').style.display = 'none';
}

/* ============ 更新逻辑 ============ */
function update(dt) {
  if (state !== 'playing') return;

  // 敌人生成（最多同时 3 个）
  if (spawnQueue > 0 && enemies.length < 3) {
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      if (spawnEnemy()) {
        spawnQueue--;
        spawnTimer = 2.0;
      } else {
        spawnTimer = 0.4; // 出生点被占，稍后重试
      }
    }
  }

  updatePlayer(dt);
  for (const e of enemies) updateEnemy(e, dt);
  for (const b of bullets) updateBullet(b, dt);
  bullets = bullets.filter(b => !b.dead);

  // 特效
  for (const fx of effects) fx.life -= dt;
  effects = effects.filter(fx => fx.life > 0);

  if (shake > 0) shake -= dt;
  updateHUD();
}

function updatePlayer(dt) {
  if (!player) return;
  player.invuln = Math.max(0, player.invuln - dt);
  let d = -1;
  if (keys['ArrowUp'] || keys['w'] || keys['W']) d = DIR.UP;
  else if (keys['ArrowRight'] || keys['d'] || keys['D']) d = DIR.RIGHT;
  else if (keys['ArrowDown'] || keys['s'] || keys['S']) d = DIR.DOWN;
  else if (keys['ArrowLeft'] || keys['a'] || keys['A']) d = DIR.LEFT;
  if (d >= 0 && d !== player.dir) setDir(player, d);
  if (d >= 0) {
    const nx = player.x + DX[player.dir] * player.speed * dt;
    const ny = player.y + DY[player.dir] * player.speed * dt;
    if (canMove(player, nx, ny)) { player.x = nx; player.y = ny; }
  }
}

function updateEnemy(e, dt) {
  e.invuln = Math.max(0, e.invuln - dt);
  e.thinkTimer -= dt;
  if (e.thinkTimer <= 0) {
    e.thinkTimer = 0.6 + Math.random() * 1.6;
    // 30% 概率朝基地方向，40% 随机转向
    if (Math.random() < 0.3) {
      const dx = (BASE_POS.x + 8) - (e.x + 8);
      const dy = (BASE_POS.y + 8) - (e.y + 8);
      const d = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? DIR.RIGHT : DIR.LEFT) : (dy > 0 ? DIR.DOWN : DIR.UP);
      setDir(e, d);
    } else if (Math.random() < 0.5) {
      setDir(e, Math.floor(Math.random() * 4));
    }
  }
  const nx = e.x + DX[e.dir] * e.speed * dt;
  const ny = e.y + DY[e.dir] * e.speed * dt;
  if (canMove(e, nx, ny)) { e.x = nx; e.y = ny; }
  else {
    // 被阻挡：换方向
    const tries = [1, 2, 3];
    const base = e.dir;
    let turned = false;
    for (const t of tries) { if (setDir(e, (base + t) % 4)) { turned = true; break; } }
    if (!turned) setDir(e, (base + 2) % 4);
  }
  e.shootTimer -= dt;
  if (e.shootTimer <= 0) {
    e.shootTimer = 0.9 + Math.random() * 2.2;
    shoot(e);
  }
}

function updateBullet(b, dt) {
  b.x += DX[b.dir] * BULLET_SPEED * dt;
  b.y += DY[b.dir] * BULLET_SPEED * dt;

  if (b.x < -4 || b.y < -4 || b.x > FIELD || b.y > FIELD) { b.dead = true; return; }

  const fx = b.x + 2 + DX[b.dir] * 3;
  const fy = b.y + 2 + DY[b.dir] * 3;
  const tx = Math.floor(fx / TILE), ty = Math.floor(fy / TILE);
  if (tx >= 0 && ty >= 0 && tx < GRID && ty < GRID) {
    const t = map[ty][tx];
    if (t === BRICK) { map[ty][tx] = EMPTY; addEffect('boom', tx * TILE + 8, ty * TILE + 8, 0.3); sfx.brick(); b.dead = true; return; }
    if (t === STEEL) { addEffect('spark', tx * TILE + 8, ty * TILE + 8, 0.2); sfx.steel(); b.dead = true; return; }
    if (t === BASE) { destroyBase(); b.dead = true; return; }
  }

  if (b.owner.isPlayer) {
    for (const e of enemies) {
      if (hitTank(e, b)) {
        if (e.invuln <= 0) { destroyTank(e); b.dead = true; return; }
        else { b.dead = true; return; }
      }
    }
  } else {
    if (player && hitTank(player, b)) {
      if (player.invuln <= 0) { destroyTank(player); b.dead = true; return; }
      else { b.dead = true; return; }
    }
  }

  // 子弹对撞
  for (const o of bullets) {
    if (o !== b && !o.dead && Math.abs(o.x - b.x) < 4 && Math.abs(o.y - b.y) < 4) {
      o.dead = true; b.dead = true; return;
    }
  }
}

/* ============ 渲染 ============ */
function draw() {
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  const sx = shake > 0 ? (Math.random() - 0.5) * 4 : 0;
  const sy = shake > 0 ? (Math.random() - 0.5) * 4 : 0;
  ctx.translate(sx, sy);

  ctx.fillStyle = '#000';
  ctx.fillRect(-4, -4, FIELD + 8, FIELD + 8);

  // 地面瓦片（不含草丛）
  for (let ty = 0; ty < GRID; ty++)
    for (let tx = 0; tx < GRID; tx++)
      drawTile(tx, ty, map[ty][tx]);

  // 坦克
  if (player && !playerBlinking(player)) drawTank(player);
  for (const e of enemies) if (!playerBlinking(e)) drawTank(e);

  // 子弹
  for (const b of bullets) {
    ctx.fillStyle = b.owner.isPlayer ? '#f2f2f2' : '#ffd166';
    ctx.fillRect(b.x, b.y, 4, 4);
  }

  // 草丛（绘制在最上层，可遮挡坦克）
  for (let ty = 0; ty < GRID; ty++)
    for (let tx = 0; tx < GRID; tx++)
      if (map[ty][tx] === TREE) drawTree(tx, ty);

  // 特效粒子
  for (const fx of effects) {
    const p = 1 - fx.life / 0.7;
    for (const pt of fx.parts) {
      ctx.globalAlpha = Math.max(0, 1 - p);
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x - 1, pt.y - 1, 2, 2);
    }
    ctx.globalAlpha = 1;
  }
}

function playerBlinking(t) {
  return t.invuln > 0 && Math.floor(t.invuln * 12) % 2 === 0;
}

function drawTile(tx, ty, t) {
  const x = tx * TILE, y = ty * TILE;
  if (t === BRICK) {
    ctx.fillStyle = '#9c4a1f';
    ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = '#7a3517';
    ctx.fillRect(x, y + 7, TILE, 1);
    ctx.fillRect(x, y + 15, TILE, 1);
    ctx.fillRect(x + 7, y, 1, 8);
    ctx.fillRect(x + 15, y + 8, 1, 8);
    ctx.fillStyle = '#c96b2f';
    ctx.fillRect(x, y, TILE, 1); ctx.fillRect(x, y, 1, TILE);
  } else if (t === STEEL) {
    ctx.fillStyle = '#8a93a6';
    ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = '#c6cede';
    ctx.fillRect(x, y, TILE, 2); ctx.fillRect(x, y, 2, TILE);
    ctx.fillStyle = '#5c6470';
    ctx.fillRect(x, y + TILE - 2, TILE, 2); ctx.fillRect(x + TILE - 2, y, 2, TILE);
  } else if (t === WATER) {
    const wave = Math.floor(performance.now() / 300) % 2;
    ctx.fillStyle = wave ? '#2b6cb0' : '#2f78c0';
    ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.fillRect(x + 2, y + 2 + wave * 2, TILE - 4, 2);
  } else if (t === BASE) {
    if (baseAlive) drawEagle(x, y);
    else { ctx.fillStyle = '#3a3f47'; ctx.fillRect(x, y, TILE, TILE); }
  }
}

function drawEagle(x, y) {
  // 金色鹰徽
  ctx.fillStyle = '#f2c14e';
  ctx.fillRect(x + 5, y + 3, 6, 5);            // 身体
  ctx.fillRect(x + 4, y + 6, 8, 2);            // 翅膀
  ctx.fillRect(x + 3, y + 5, 2, 2); ctx.fillRect(x + 11, y + 5, 2, 2);
  ctx.fillRect(x + 6, y + 8, 4, 5);            // 底部
  ctx.fillStyle = '#5c3a0e';
  ctx.fillRect(x + 7, y + 5, 2, 1);            // 眼睛
}

function drawTree(tx, ty) {
  const x = tx * TILE, y = ty * TILE;
  ctx.fillStyle = '#3f7a3a';
  ctx.fillRect(x, y, TILE, TILE);
  ctx.fillStyle = '#4f9448';
  ctx.fillRect(x + 2, y + 2, 4, 4); ctx.fillRect(x + 9, y + 3, 4, 4);
  ctx.fillRect(x + 4, y + 10, 5, 4); ctx.fillRect(x + 11, y + 11, 3, 3);
}

function drawTank(t) {
  const x = t.x, y = t.y;
  const pal = t.isPlayer
    ? { hull: '#e8c547', tread: '#b8860b', turret: '#d4a017', barrel: '#c9a227' }
    : { hull: '#b0413e', tread: '#7c2a27', turret: '#8e322e', barrel: '#a03a36' };

  ctx.fillStyle = pal.tread;
  if (t.dir === DIR.UP || t.dir === DIR.DOWN) {
    ctx.fillRect(x + 1, y + 3, 3, 10);
    ctx.fillRect(x + 12, y + 3, 3, 10);
  } else {
    ctx.fillRect(x + 3, y + 1, 10, 3);
    ctx.fillRect(x + 3, y + 12, 10, 3);
  }
  ctx.fillStyle = pal.hull;
  ctx.fillRect(x + 4, y + 4, 8, 8);
  ctx.fillStyle = pal.turret;
  ctx.fillRect(x + 6, y + 6, 4, 4);
  ctx.fillStyle = pal.barrel;
  switch (t.dir) {
    case DIR.UP:    ctx.fillRect(x + 7, y - 2, 2, 6); break;
    case DIR.DOWN:  ctx.fillRect(x + 7, y + 12, 2, 6); break;
    case DIR.RIGHT: ctx.fillRect(x + 12, y + 7, 6, 2); break;
    case DIR.LEFT:  ctx.fillRect(x - 2, y + 7, 6, 2); break;
  }
}

/* ============ 主循环 ============ */
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* 初始化界面 */
updateHUD();
</script>
</body>
</html>
